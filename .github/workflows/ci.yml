name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: WallIServer (.NET + JS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WallIServer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: WallIServer/global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: .NET tests
        run: dotnet test
      - name: JS tests
        run: node --test tests/js/*.test.mjs

  firmware:
    name: WallISetup (PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WallISetup
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('WallISetup/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Native unit tests
        run: pio test -e native
      - name: Build firmware
        run: pio run -e nodemcuv2
