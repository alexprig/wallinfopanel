; WallISetup — ESP8266 firmware for the WallInfoPanel e-paper panel.
; Open THIS folder (WallISetup/) in VS Code with the PlatformIO IDE extension.
; CLI:  pio run                       build release firmware
;       pio run -t upload             flash over USB (CH340)
;       pio device monitor            serial console (115200)
;       pio test -e native            host-side unit tests (lib/core)
;       pio run -e nodemcuv2_debug -t upload   bench build: RUN mode forced, logs on Serial

[platformio]
default_envs = nodemcuv2

; ---------------------------------------------------------------- ESP8266 base
[esp8266_base]
platform = espressif8266@4.2.1
framework = arduino
board = nodemcuv2
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld      ; 4 MB flash: ~3 MB app/OTA, 1 MB LittleFS
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
upload_speed = 115200       ; 460800 dropped packets on this board (timed out after the baud switch)
build_flags =
    -D FW_VERSION=\"0.1.0\"
    -Wall
lib_deps =
    adafruit/Adafruit GFX Library@^1.13.0
    bblanchon/ArduinoJson@^7.4.3

; ---------------------------------------------------------------- targets
[env:nodemcuv2]
extends = esp8266_base

; Bench build: ignores the setup switch (always RUN mode) and logs to Serial.
; Use it on USB before the CH340 switch mod is done. Not for battery use.
[env:nodemcuv2_debug]
extends = esp8266_base
build_flags =
    ${esp8266_base.build_flags}
    -D WALLI_FORCE_RUN=1
    -D WALLI_DEBUG=1

; ---------------------------------------------------------------- host tests
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
